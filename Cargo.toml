[workspace]
resolver = "2"
members = [
    "rust/guest-provider",
    "rust/wasmtime",
    "conformance/server",
    "conformance/guest-ct",
    "conformance/driver-ct",
    "examples/echo-demo",
    "examples/wasmtime-demo",
]
# The native (host-target) crates: bare `cargo clippy` / `cargo test` cover
# exactly this set. The wasm-only crates (conformance/guest-ct, echo-demo)
# build for their wasm targets through the justfile recipes.
default-members = [
    "rust/guest-provider",
    "rust/wasmtime",
    "conformance/server",
    "conformance/driver-ct",
    "examples/wasmtime-demo",
]

[workspace.dependencies]
# The component-test harness, rev-pinned (no registry release yet).
# One rev everywhere: these two entries, the CLI install
# (conformance/driver-ct/justfile reads the rev back out of Cargo.lock),
# the @polymorph/component-test-js pin in
# conformance/driver-ct/deltic/package.json, and the actions/aggregate
# ref in .github/workflows/ci.yml. Bump all together with
# `component-test pins bump <rev> --cargo-toml Cargo.toml --package-json
# conformance/driver-ct/deltic/package.json --workflow
# .github/workflows/ci.yml`, then `cargo update component-test-sdk
# component-test-runner` and `pnpm --dir conformance/driver-ct/deltic
# install`; the _ct-tools pins gate and the CI ref guard fail on skew.
component-test-sdk = { git = "https://github.com/polymorph-components/polymorph-test", rev = "3ec431717895b2e4fa81500794e0da7fd13e26e7" }
component-test-runner = { git = "https://github.com/polymorph-components/polymorph-test", rev = "3ec431717895b2e4fa81500794e0da7fd13e26e7" }
anyhow = "1"
bytes = "1"
futures = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
toml = "0.8"
wasmtime = { version = "47", features = [
    "component-model",
    "component-model-async",
    "async",
    "runtime",
] }
wit-bindgen = "0.59"
