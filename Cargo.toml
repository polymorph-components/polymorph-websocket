[workspace]
resolver = "2"
members = [
    "rust/guest-provider",
    "rust/wasmtime",
    "conformance/server",
    "conformance/guest-ct",
    "conformance/driver-ct",
    "examples/echo-demo",
    "examples/wasmtime-demo",
]
# The native (host-target) crates: bare `cargo clippy` / `cargo test` cover
# exactly this set. The wasm-only crates (conformance/guest-ct, echo-demo)
# build for their wasm targets through the justfile recipes.
default-members = [
    "rust/guest-provider",
    "rust/wasmtime",
    "conformance/server",
    "conformance/driver-ct",
    "examples/wasmtime-demo",
]

[workspace.dependencies]
# The component-test harness: the crates pinned by git rev, the JS
# runner core from JSR (@jsr/polymorph__test, npm.jsr.io per-tree
# .npmrc). Both sides of a bump name ONE polymorph-test release:
# `component-test pins bump <rev> --cargo-toml Cargo.toml --workflow
# .github/workflows/ci.yml` with the release-tag commit, `cargo update
# -p component-test-sdk -p component-test-runner`, then set the
# matching release version on the `@jsr/polymorph__test` dependency in
# conformance/driver-ct/polyengine/package.json and `pnpm --dir
# conformance/driver-ct/polyengine install` — the cargo pins gate, the
# runner-js pin gate, and the CI ref guard fail on skew.
component-test-sdk = { git = "https://github.com/polymorph-components/polymorph-test", rev = "38bfedf2b989522b82ddce5320fc1557a2f61461" }
component-test-runner = { git = "https://github.com/polymorph-components/polymorph-test", rev = "38bfedf2b989522b82ddce5320fc1557a2f61461" }
anyhow = "1"
bytes = "1"
futures = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
toml = "0.8"
wasmtime = { version = "47", features = [
    "component-model",
    "component-model-async",
    "async",
    "runtime",
] }
wit-bindgen = "0.59"
