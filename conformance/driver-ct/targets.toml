# Target capability manifest for the component-test conformance harness
# (the #48-mechanism successor to ../targets.toml).
#
# The wasmtime rows run under the generic component-test host runner and
# the composed row runs the wac-composed in-guest provider; the polyengine
# rows runtime-link the same suite artifact under the release-pinned
# polyengine runtime — on stock Deno (driver-ct/polyengine/run.ts) and
# inside headless Chromium (driver-ct/polyengine/run-browser.mjs), with no
# transpile step and no engine flag.
#
# No [features]: every current target serves the whole polymorph:websocket
# surface. When a capability gap appears, declare it here (`[features.x]
# kind = "gated"` + `missing-features`), tag the affected cases, and add
# a `!x` decline probe — the component-test replacement for the
# incumbent's tag-scoped `unsupported` declarations.
#
# Known failures go under `[[targets.<t>.expected-fail]]` with a
# mandatory reason and tracking link (never a deleted test); a passing
# expected-fail fails the aggregate until the declaration is removed.
version = "0.1"

[targets.wasmtime]
missing-features = []

[targets.composed]
missing-features = []

[targets.polyengine-deno]
missing-features = []

# The same suite runtime-linked inside headless Chromium against the
# polyengine host module (js/polyengine/websocket.ts over the browser's
# native WebSocket): one deno-bundled worker, no transpile step.
[targets.polyengine-browser]
missing-features = []
